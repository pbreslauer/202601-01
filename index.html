<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>30th St Tracker</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { text-align: center; width: 100%; }
        .route-label { font-size: 1.2rem; color: #666; text-transform: uppercase; letter-spacing: 2px; }
        .eta-number { font-size: 10rem; font-weight: 900; color: #00FF41; line-height: 0.9; margin: 10px 0; }
        .unit { font-size: 1.5rem; color: #00FF41; font-weight: bold; }
        .footer { margin-top: 30px; font-size: 0.8rem; color: #333; }
        #status-msg { color: #888; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container" onclick="updateTracker()">
        <div class="route-label" id="route-name">Route 49</div>
        <div id="stop-display" style="color:#444; font-size:0.9rem;">30th St Station (Stop 21102)</div>
        
        <div id="eta-container">
            <div class="eta-number" id="eta">--</div>
            <div class="unit" id="unit-label">MINUTES</div>
        </div>

        <div id="status-msg">Scanning Hub...</div>
        <div class="footer">Tap to refresh • <span id="last-update">--</span></div>
    </div>

    <script>
        const STOP_ID = '21102';
        const TARGET_ROUTE = '49';

        async function updateTracker() {
            const etaDisp = document.getElementById('eta');
            const statusDisp = document.getElementById('status-msg');
            const routeDisp = document.getElementById('route-name');
            const timeDisp = document.getElementById('last-update');

            try {
                const url = `https://www3.septa.org/api/BusSchedules/index.php?stop_id=${STOP_ID}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const keys = Object.keys(data);

                if (keys.length === 0) {
                    etaDisp.innerText = "--";
                    statusDisp.innerText = "No buses at this hub";
                    return;
                }

                // 1. Try to find the 49 specifically
                let bus = null;
                const matchKey = keys.find(k => k.includes(TARGET_ROUTE));
                
                if (matchKey && data[matchKey].length > 0) {
                    bus = data[matchKey][0];
                    routeDisp.innerText = "Route 49";
                } else {
                    // 2. FALLBACK: If no 49, show the absolute next bus of ANY route
                    const firstRouteKey = keys[0];
                    bus = data[firstRouteKey][0];
                    routeDisp.innerText = `Next: Route ${firstRouteKey}`;
                }

                // Calculate Minutes
                const arrivalTime = new Date(bus.DateCalendar);
                const now = new Date();
                const diffMins = Math.floor((arrivalTime - now) / 60000);

                if (diffMins <= 0) {
                    etaDisp.innerText = "0";
                    statusDisp.innerText = "Arriving now";
                    etaDisp.style.color = "#FFFF00";
                } else {
                    etaDisp.innerText = diffMins;
                    statusDisp.innerText = `To ${bus.Destination}`;
                    etaDisp.style.color = "#00FF41";
                }
                
                timeDisp.innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            } catch (err) {
                statusDisp.innerText = "Connection Error";
                console.error(err);
            }
        }

        updateTracker();
        setInterval(updateTracker, 30000);
    </script>
</body>
</html>
